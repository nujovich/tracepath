{{- if .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tracepath.fullname" . }}-gateway
  labels:
    {{- include "tracepath.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.gateway.ingress.className }}
  rules:
    - host: {{ .Values.gateway.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "tracepath.fullname" . }}-gateway
                port:
                  number: {{ .Values.gateway.service.port }}
{{- end }}
---
{{- if .Values.dashboard.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tracepath.fullname" . }}-dashboard
  labels:
    {{- include "tracepath.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.dashboard.ingress.className }}
  rules:
    - host: {{ .Values.dashboard.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tracepath.fullname" . }}-dashboard
                port:
                  number: {{ .Values.dashboard.service.port }}
{{- end }}
