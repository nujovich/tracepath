apiVersion: v2
name: tracepath
description: Tracepath — Agent Audit Stack. Middleware for auditable, traceable, and compliant AI agents.
type: application
version: 0.3.0
appVersion: "0.3.0"
keywords:
  - ai
  - audit
  - compliance
  - eu-ai-act
  - finra
  - soc2
  - opa
  - agents
home: https://github.com/nujovich/tracepath
sources:
  - https://github.com/nujovich/tracepath
maintainers:
  - name: Tracepath Team
    email: tracepath@mermelada.tech
dependencies:
  - name: postgresql
    version: "16.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: nats
    version: "1.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: nats.enabled
  - name: minio
    version: "14.x"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: minio.enabled
